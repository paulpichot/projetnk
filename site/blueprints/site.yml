title: Site

tabs:
  pages:
    label: Pages
    icon: page
    sections:
      pages:
        label: Pages du site
        type: pages
        status: all
        create:
          - legal
          - support-private
        image: false

  identity:
    label: Identité
    icon: settings
    columns:
      main:
        width: 1/2
        fields:
          description:
            label: Description de l'association
            type: textarea
            buttons: false
            maxlength: 300
          privacy:
            label: Page « Politique de confidentialité »
            type: pages
            max: 1
            multiple: false
          rgive_url:
            label: Plateforme de don RGive
            type: url
            placeholder: https://don.projetnk.org
          launch_mode:
            label: Mode lancement
            type: toggle
            text:
              - Site public visible
              - Compte à rebours à la place du site
      sidebar:
        width: 1/2
        fields:
          logoblack:
            label: Logo de l'en-tête
            type: files
            max: 1
            multiple: false
            layout: cards
            image:
              back: white
            query: site.files.filterBy("extension", "svg")
            uploads: logo
          logomark:
            label: Logo du pied de page
            type: files
            max: 1
            multiple: false
            layout: cards
            image:
              back: white
            query: site.files.filterBy("extension", "svg")
            uploads: logo
          favicon:
            label: Favicon
            type: files
            max: 1
            multiple: false
            layout: cards
            query: site.files.filterBy("extension", "in", ["png", "svg", "ico"])
            uploads: favicon

  menus:
    label: Menus
    icon: menu
    sections:
      menus:
        extends: sections/menus

  seo: seo/site
