title: Projet
icon: page

options:
  changeTemplate: false

status:
  draft: Brouillon
  listed: Publié

create:
  title:
    label: Nom du projet
  fields:
    - period

tabs:
  article:
    label: Article
    icon: text
    fields:
      headline:
        label: Titre de l'article
        type: textarea
        buttons: false
        size: small
      lead:
        label: Chapô
        type: textarea
        buttons: false
        size: small
      tool:
        label: Encart outil
        type: object
        fields:
          label:
            label: Sur-titre
            type: text
            width: 1/2
          button:
            label: Texte du bouton
            type: text
            width: 1/2
          text:
            label: Texte
            type: textarea
            buttons: false
          link:
            label: Lien
            type: link
            options:
              - url
              - page
              - file
              - custom
      cover:
        label: Image principale
        type: files
        max: 1
        multiple: false
        layout: cards
        query: page.images
        uploads: image
      text:
        label: Contenu
        type: blocks
        fieldsets:
          - heading
          - text
          - list
          - quote
          - image
          - callout
      tags:
        label: Mots-clés
        type: tags
        options:
          type: query
          query: page.siblings.pluck("tags", ",", true)

  card:
    label: Carte projet
    icon: dashboard
    columns:
      main:
        width: 2/3
        fields:
          period:
            label: Période
            type: text
            placeholder: Novembre 2026
            width: 1/2
          upcoming:
            label: À venir
            type: toggle
            width: 1/2
          excerpt:
            label: Résumé
            type: textarea
            buttons: false
            size: small
            maxlength: 220
      sidebar:
        width: 1/3
        fields:
          thumbnail:
            label: Visuel de la carte
            type: files
            max: 1
            multiple: false
            layout: cards
            query: page.images
            uploads: image
          partner:
            label: Logo partenaire
            type: files
            max: 1
            multiple: false
            layout: cards
            image:
              back: white
              cover: false
            query: page.images
            uploads: image

  meta:
    label: Auteur et publication
    icon: user
    fields:
      author:
        label: Auteur·rice
        type: text
        width: 1/2
      author_photo:
        label: Photo de l'auteur·rice
        type: files
        max: 1
        multiple: false
        query: page.images
        uploads: image
        width: 1/2
      published:
        label: Date de publication
        type: date
        display: DD/MM/YYYY
        default: today
        width: 1/2
      reading_time:
        label: Temps de lecture
        type: number
        min: 1
        after: min
        width: 1/2

  seo: seo/page
