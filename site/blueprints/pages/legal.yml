title: Page légale
icon: document

options:
  changeTemplate: false

tabs:
  content:
    label: Contenu
    icon: text
    fields:
      updated:
        label: Dernière mise à jour
        type: date
        display: DD/MM/YYYY
        default: today
        width: 1/3
      intro:
        label: Introduction
        type: textarea
        buttons: false
      text:
        label: Contenu
        type: textarea
        size: large
        buttons:
          - headlines
          - bold
          - italic
          - link
          - email
          - ul
          - ol

  seo: seo/page
