title: Page par défaut
icon: 📄

# Onglets principaux
tabs:
  content:
    label: Contenu
    columns:
      # Colonne principale (2/3)
      - width: 2/3
        sections:
          # Contenu principal par blocs
          content:
            type: blocks
            label: Contenu
            fieldsets:
              - text
              - gallery
              - quote
              - video
              - separator
              - cta
            group: content

      # Sidebar (1/3)
      - width: 1/3
        sections:
          # Métadonnées de la page
          meta:
            type: fields
            fields:
              # Image de couverture
              cover:
                extends: fields/cover
                label: Image de couverture
                help: Image principale de la page
              
              # Extrait/Description
              excerpt:
                label: Extrait
                type: textarea
                maxlength: 300
                help: Résumé court de la page (utilisé dans les listings)
              
              # Date de publication
              date:
                label: Date
                type: date
                default: now
                time: true
              
              # Auteur
              author:
                label: Auteur
                type: users
                default: current
                max: 1

          # Paramètres d'affichage
          display:
            type: fields
            fields:
              # Layout de la page
              layout:
                label: Layout
                type: radio
                options:
                  default: "Standard"
                  wide: "Large"
                  fullwidth: "Pleine largeur"
                default: default
              
              # Afficher l'image de couverture
              show_cover:
                label: Afficher l'image de couverture
                type: toggle
                default: true
              
              # Afficher la date
              show_date:
                label: Afficher la date
                type: toggle
                default: false

  # Onglet SEO
  seo:
    extends: tabs/seo
    label: SEO

# Sidebar du panel
sidebar:
  # Statut de la page
  status:
    type: fields
    fields:
      status:
        label: Statut
        type: radio
        options:
          draft: "Brouillon"
          unlisted: "Non listée"
          listed: "Publiée"
        default: draft

  # Informations sur la page
  info:
    type: fields
    fields:
      created:
        label: Créée le
        type: info
        text: "{{ page.created.toDate('d/m/Y à H:i') }}"
      
      modified:
        label: Modifiée le
        type: info
        text: "{{ page.modified.toDate('d/m/Y à H:i') }}"
      
      url:
        label: URL
        type: info
        text: "{{ page.url }}"