title: Projets
icon: grid

options:
  changeSlug: false
  changeTemplate: false
  delete: false
  duplicate: false

tabs:
  projects:
    label: Projets
    icon: grid
    sections:
      projects:
        label: Projets
        type: pages
        template: project
        status: all
        layout: cards
        size: medium
        image:
          query: page.thumbnail.toFile
          cover: true
          back: white
        info: "{{ page.upcoming.toBool ? 'À venir' : page.period }}"
      upcoming:
        type: fields
        fields:
          upcoming_headline:
            label: Encart « Prochainement »
            type: headline
          upcoming_label:
            label: Sur-titre
            type: text
            width: 1/2
          upcoming_title:
            label: Titre
            type: text
            width: 1/2
          upcoming_text:
            label: Texte
            type: textarea
            buttons: false
          upcoming_button:
            label: Texte du bouton
            type: text
            width: 1/2
          upcoming_link:
            label: Lien du bouton
            type: link
            options:
              - anchor
              - page
              - url
            width: 1/2

  missions:
    label: Missions
    icon: flag
    columns:
      main:
        width: 2/3
        fields:
          statements_label:
            label: Sur-titre
            type: text
            placeholder: Nos missions
          statements:
            label: Missions
            type: structure
            columns:
              text: true
            fields:
              text:
                label: Texte
                type: textarea
                buttons: false
      sidebar:
        width: 1/3
        fields:
          hero_image:
            label: Photo
            type: files
            max: 1
            multiple: false
            layout: cards
            query: page.images
            uploads: image

  labels:
    label: Textes des articles
    icon: text
    fields:
      back_label:
        label: Lien de retour
        type: text
        placeholder: Retour
        width: 1/3
      author_prefix:
        label: Avant le nom de l'auteur·rice
        type: text
        placeholder: Par
        width: 1/3
      others_label:
        label: Titre « Autres projets »
        type: text
        placeholder: Autres projets
        width: 1/3
      share_label:
        label: Libellé « Partager »
        type: text
        placeholder: Partager
        width: 1/2
      copy_label:
        label: Bouton « Copier le lien »
        type: text
        placeholder: Copier le lien
        width: 1/2

  seo: seo/page
